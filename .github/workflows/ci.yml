name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  web:
    name: web (vitest + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishguard/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: phishguard/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  training:
    name: training (offline feature tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phishguard/training
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python src/features_test.py
